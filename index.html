<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts Sala do Futuro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Matrix rain canvas */
        #matrix {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.15;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #00cc33;
            margin-bottom: 40px;
            font-size: 0.9rem;
        }

        .subtitle::before {
            content: '> ';
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .btn-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            display: block;
            text-align: center;
            padding: 14px 20px;
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 15px #00ff41, 0 0 30px rgba(0, 255, 65, 0.3);
        }

        .btn::before {
            content: '[ ';
        }
        .btn::after {
            content: ' ]';
        }

        .btn-whatsapp {
            border-color: #25d366;
            color: #25d366;
        }
        .btn-whatsapp:hover {
            background: #25d366;
            color: #0a0a0a;
            box-shadow: 0 0 15px #25d366;
        }

        .btn-ai {
            border-color: #00bfff;
            color: #00bfff;
        }
        .btn-ai:hover {
            background: #00bfff;
            color: #0a0a0a;
            box-shadow: 0 0 15px #00bfff;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #006622;
            font-size: 0.8rem;
        }

        .blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <h1>Scripts Sala do Futuro</h1>
    <p class="subtitle">selecione uma plataforma<span class="blink">_</span></p>

    <div class="btn-grid">
        <!-- AQUI você coloca um botão para cada site -->
        <a class="btn" href="https://exemplo1.com" target="_blank">Nome do Site 1</a>
        <a class="btn" href="https://exemplo2.com" target="_blank">Nome do Site 2</a>
        <a class="btn" href="https://exemplo3.com" target="_blank">Nome do Site 3</a>
        <a class="btn" href="https://exemplo4.com" target="_blank">Nome do Site 4</a>

        <!-- Botão Inteligência Artificial -->
        <a class="btn btn-ai" href="https://chat.openai.com" target="_blank">Inteligência Artificial</a>

        <!-- Botão WhatsApp - TROQUE O NÚMERO pelo seu -->
        <a class="btn btn-whatsapp" href="https://wa.me/5511999999999?text=Ol%C3%A1%20Pedro%2C%20me%20ajude!" target="_blank">Dúvidas? Fale comigo</a>
    </div>

    <p class="footer">[ sistema online ]</p>
</div>

<script>
// Efeito Matrix rain
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*';
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function draw() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff41';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}
setInterval(draw, 50);

// Recalcular colunas no resize
window.addEventListener('resize', () => {
    columns = Math.floor(canvas.width / fontSize);
    drops = Array(columns).fill(1);
});
</script>

</body>
</html>
